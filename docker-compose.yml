version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: document-postgres
    environment:
      POSTGRES_DB: documentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-scripts/schema-init.sql:/docker-entrypoint-initdb.d/schema-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: document-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: document-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/document-bucket;
        mc anonymous set none local/document-bucket;
        echo 'MinIO bucket initialized';
      "

  document-management-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-management-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/documentdb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: document-bucket
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    # Memory limit — streaming ensures large uploads don't exhaust heap
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
